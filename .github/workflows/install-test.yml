name: Installation Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-install:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Install PYEAST
        run: |
          uv sync

      - name: Test CLI help commands
        run: |
          uv run pyeast --help
          uv run pyeast tar --help
          uv run pyeast integrate --help
          uv run pyeast delete --help
          uv run pyeast replace --help
          uv run pyeast batch --help
          uv run pyeast gg --help

      - name: Test init command
        run: |
          python -c "import os; os.makedirs('test_data_dir', exist_ok=True)"
          uv run pyeast init --data-dir ./test_data_dir

      - name: Run test suite
        run: |
          uv run pytest tests/ -v --cov=src/pyeast --cov-report=term-missing
